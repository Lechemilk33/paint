# Netlify build. The repo root is the app, so there is no base directory.
#
# This is a server-rendered Next app: @netlify/plugin-nextjs turns the build
# output into functions, so there is no publish directory to point at and no
# redirect rule for `/` - app/page.tsx issues that redirect on the server.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
